[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indoor-gnss-simulator"
version = "0.1.0"
description = "Reproducible GPS relay observation and complex baseband simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
indoor-gnss = "indoor_gnss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
